<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Make an Enquiry | PanelPro Auto Spares</title>
  <meta name="description" content="Ask PanelPro Auto Spares about vehicle parts, product availability and pricing.">
  <meta name="keywords" content="auto parts enquiry, spare parts quote, PanelPro Auto Spares">
  <meta name="author" content="PanelPro Auto Spares"><meta name="theme-color" content="#17212b">
  <meta property="og:site_name" content="PanelPro Auto Spares"><meta property="og:title" content="Make an Enquiry | PanelPro Auto Spares">
  <meta property="og:description" content="Request information about automotive parts and availability."><meta property="og:type" content="website">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
<header><div class="logo"><img src="_images/logo.svg" alt="PanelPro Auto Spares Logo" width="100" height="100"><a href="index.html">PanelPro Auto Spares</a></div>
<nav aria-label="Main navigation"><ul><li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li><li><a href="services.html">Services</a></li><li><a href="contactus.html">Contact</a></li><li><a class="active" href="enquiry.html">Enquiry</a></li></ul></nav></header>
<main><section class="page-intro"><h1>Product and Service Enquiry</h1><p>Tell us what you are looking for. We will use the details to help confirm availability and prepare a quote.</p></section>
<section class="form-section"><form id="enquiryForm" class="site-form" novalidate>
<label for="enquiryName">Full name</label><input id="enquiryName" name="name" autocomplete="name" required minlength="2">
<label for="enquiryEmail">Email address</label><input id="enquiryEmail" name="email" type="email" autocomplete="email" required>
<label for="enquiryPhone">Phone number</label><input id="enquiryPhone" name="phone" type="tel" pattern="[0-9+() -]{7,20}" required>
<label for="enquiryType">What is your enquiry about?</label><select id="enquiryType" name="type" required><option value="">Select an option</option><option>Body panels</option><option>Trim and accessories</option><option>Workshop support</option><option>Bulk order</option><option>Parts advice</option><option>Volunteering or sponsorship</option><option>Other</option></select>
<label for="vehicle">Vehicle make, model and year (if applicable)</label><input id="vehicle" name="vehicle" placeholder="e.g. Toyota Corolla, 2018">
<label for="part">Part or service required</label><input id="part" name="part" required minlength="2" placeholder="Describe the part you need">
<label for="quantity">Quantity</label><input id="quantity" name="quantity" type="number" min="1" max="500" value="1" required>
<label for="enquiryMessage">Additional details</label><textarea id="enquiryMessage" name="message" rows="5" maxlength="1500" placeholder="Add colour, side, part number or other useful details"></textarea>
<p id="enquiryError" class="form-error" role="alert"></p><button class="btn" type="submit">Submit enquiry</button>
</form><div id="enquiryResult" class="form-result" role="status" hidden></div></section></main>
<footer class="site-footer"><p>&copy; 2026 PanelPro Auto Spares. All rights reserved.</p></footer>
</body></html>
